name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"
      - name: test
        run: go test ./...
        env:
          CGO_ENABLED: "0"
      - name: site is up to date with topics
        run: |
          go run ./tools/gensite
          git diff --exit-code site/api
